name: Web Command Center CI

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/api/scripts/pilot01.cjs'
      - 'apps/api/src/connect/pilot01.integration.spec.ts'
      - 'docs/PILOT_01_DEMO.md'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/web-command-center-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'apps/api/scripts/pilot01.cjs'
      - 'apps/api/src/connect/pilot01.integration.spec.ts'
      - 'docs/PILOT_01_DEMO.md'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/web-command-center-ci.yml'

permissions:
  contents: read

concurrency:
  group: web-command-center-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Test web transport configuration
        run: pnpm --filter @vantara/web test

      - name: Build web
        env:
          WEB_ORIGIN: https://synthetic-staging.example.invalid
          API_INTERNAL_URL: http://api.internal:3001
        run: pnpm --filter @vantara/web build

      - name: Assert guest route is included in production build
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/web/.next/server/app-paths-manifest.json';
          if (!fs.existsSync(path)) throw new Error('Next.js app-paths manifest missing');
          const routes = Object.keys(JSON.parse(fs.readFileSync(path, 'utf8')));
          for (const route of ['/page', '/onboarding/page', '/connect/[token]/page']) {
            if (!routes.includes(route)) throw new Error('Missing Next.js app route: ' + route + '; found: ' + routes.join(', '));
          }
          console.log('Verified guest Connect, onboarding and home routes');
          NODE
