name: API Security CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - foundation-002-rbac

permissions:
  contents: read

jobs:
  api-tests-and-build:
    name: API tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @vantara/api exec prisma generate

      - name: Run API test suite
        run: pnpm --filter @vantara/api test

      - name: Build API
        run: pnpm --filter @vantara/api build
