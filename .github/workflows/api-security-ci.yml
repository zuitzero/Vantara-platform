name: API Security CI

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/api-security-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/api-security-ci.yml'

permissions:
  contents: read

concurrency:
  group: api-security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vantara
          POSTGRES_PASSWORD: vantara
          POSTGRES_DB: vantara_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vantara -d vantara_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @vantara/api exec prisma generate

      - name: Validate fresh database migration chain
        env:
          DATABASE_URL: postgresql://vantara:vantara@localhost:5432/vantara_ci?schema=public
        run: pnpm --filter @vantara/api exec prisma migrate deploy

      - name: Run API test suite
        run: pnpm --filter @vantara/api test

      - name: Build API
        run: pnpm --filter @vantara/api build
